name: build

on:
  workflow_dispatch:
    inputs:
      maafw_repo:
        description: "MaaFramework fork/repo carrying the iOS controller"
        default: YJBeetle/MaaFramework
      maafw_ref:
        description: "branch or tag of that repo"
        default: feat/ios-control-unit
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  package:
    # 先只出 macOS 包：xdb 协议本身是跨平台的（macOS / Linux / Windows 桌面 + Android 内嵌），
    # 但这条打包链路只在 macOS 上实测过，Windows 的 MaaDeps/preset 还没验证。
    runs-on: macos-15
    env:
      MAAFW_REPO: ${{ github.event.inputs.maafw_repo || 'YJBeetle/MaaFramework' }}
      MAAFW_REF: ${{ github.event.inputs.maafw_ref || 'feat/ios-control-unit' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: Dual11Event

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MAAFW_REPO }}
          ref: ${{ env.MAAFW_REF }}
          path: MaaFramework
          submodules: recursive

      - name: Install ninja
        run: brew install ninja

      - name: Fetch OCR models
        run: |
          python3 Dual11Event/scripts/fetch-ocr.py
          ls -l Dual11Event/assets/model/ocr/

      - name: Bootstrap MaaDeps
        working-directory: MaaFramework
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/maadeps-download.py arm64-osx

      - name: Build MaaFramework
        working-directory: MaaFramework
        run: |
          cmake --preset 'NinjaMulti' \
            -DMAADEPS_TRIPLET='maa-arm64-osx' \
            -DCMAKE_OSX_SYSROOT=macosx \
            -DCMAKE_OSX_ARCHITECTURES='arm64' \
            -DWITH_IOS_CONTROLLER=ON
          cmake --build build --preset 'NinjaMulti - Release' -j 4
          cmake --install build --prefix install --config Release

      - name: Build and package Dual11Event
        working-directory: Dual11Event
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMAAFW_DIR="$GITHUB_WORKSPACE/MaaFramework/install"
          cmake --build build -j 4
          rm -rf dist && cmake --install build --prefix dist

      - name: Zip
        working-directory: Dual11Event
        run: |
          shasum -a 256 dist/Dual11Event | head -1
          ditto -c -k --sequesterRsrc dist "Dual11Event-macos-aarch64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Dual11Event-macos-aarch64
          path: Dual11Event/Dual11Event-macos-aarch64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: Dual11Event
        run: gh release upload "${GITHUB_REF_NAME}" "Dual11Event-macos-aarch64.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
